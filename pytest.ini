[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    ignore:.*BlockingPortal.*:DeprecationWarning
    ignore:.*anyio.*:DeprecationWarning
    ignore:.*starlette.*:DeprecationWarning
    ignore:.*google.generativeai.*:FutureWarning
markers =
    asyncio: marks tests that need an asyncio event loop
